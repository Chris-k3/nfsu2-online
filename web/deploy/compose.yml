# NFS Underground 2 in the browser on a VPS, with Docker (docs/web/DOCKER.md): the server's image (Dockerfile)
# and Caddy, which does HTTPS with a Let's Encrypt certificate it gets and renews by itself.  Both use the VPS's
# own network, as Caddy and the server do without Docker (docs/web/VPS.md, A): Caddy on ports 80 and 443,
# forwarding to the server on 127.0.0.1:8080, which nothing outside the VPS can reach.  So Caddy sees every
# player's real address, over IPv6 too, and the VPS's firewall (ufw, nftables) decides who can play.  (Ports
# published from a Docker network would pass by that firewall, and would give every IPv6 player the same
# address, which the server's per-address limits then count as one.)
#
# In .env next to this file (or the environment):
#   NFSU2_HOST=game.example.com      the name players open; its DNS record points at this VPS
#   NFSU2_DATA=/srv/nfsu2/game       your NFS Underground 2 folder (default ./game), readable by everyone
#   NFSU2_MODULE=/srv/nfsu2/module   nfsu2.wasm and nfsu2.json from web/build.sh (default ./module)
#   NFSU2_IMAGE=<image>              the server's image (default ghcr.io/th0mk/nfsu2-web:latest)
#   NFSU2_HTTP_PORT=8080             the server's port on 127.0.0.1, if 8080 is taken on the VPS
#   NFSU2_REAL_IP_HEADER=cf-connecting-ip    only with Cloudflare's proxy (orange cloud) in front of Caddy
# then:  docker compose up -d && docker compose logs -f server
# A Cloudflare Tunnel instead of Caddy: compose.tunnel.yml.
name: nfsu2-web
services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    network_mode: host
    configs: [{ source: caddyfile, target: /etc/caddy/Caddyfile }]
    volumes: [caddy-data:/data, caddy-config:/config]
  server:
    image: ${NFSU2_IMAGE:-ghcr.io/th0mk/nfsu2-web:latest}
    restart: unless-stopped
    network_mode: host
    command: ["--behind-proxy"]
    environment:
      NFSU2_HOST: ${NFSU2_HOST:?set NFSU2_HOST in .env, the name players open (game.example.com)}
      NFSU2_HTTP_PORT: ${NFSU2_HTTP_PORT:-8080}
      NFSU2_REAL_IP_HEADER: ${NFSU2_REAL_IP_HEADER:-x-forwarded-for}
    volumes:
      - ${NFSU2_DATA:-./game}:/game:ro
      - ${NFSU2_MODULE:-./module}:/module:ro
      - state:/state
    # what the systemd unit (nfsu2-web.service) allows the server, as far as a container goes: nothing to write
    # but its state, no capabilities, 3 GB of memory and no swap, 8192 open files (250 players)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    memswap_limit: 3g
    ulimits: { nofile: 8192 }
configs:
  caddyfile:
    # Caddy's admin API (127.0.0.1:2019) stays off: nothing reconfigures Caddy while it runs
    content: |
      {
      	admin off
      }
      ${NFSU2_HOST:-} {
      	reverse_proxy 127.0.0.1:${NFSU2_HTTP_PORT:-8080}
      	header -Server
      }
volumes:
  state:
  caddy-data:
  caddy-config:
