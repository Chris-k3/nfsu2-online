# A Cloudflare Tunnel to the server (/etc/cloudflared/config.yml): cloudflared
# connects out to Cloudflare, so the VPS needs no open port for the game at all.
#   cloudflared tunnel login; cloudflared tunnel create nfsu2
#   cloudflared tunnel route dns nfsu2 game.example.com
#   cloudflared service install
# The server runs with --behind-proxy --http-port 8080 --host game.example.com
# --real-ip-header cf-connecting-ip.  cloudflared opens a connection to it for
# each request in progress and has no limit of its own per client: the server
# limits each client address (from CF-Connecting-IP) to 64 requests at once.
tunnel: <tunnel id>
credentials-file: /etc/cloudflared/<tunnel id>.json
ingress:
  - hostname: game.example.com
    service: http://127.0.0.1:8080
  - service: http_status:404
