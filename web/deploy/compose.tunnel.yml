# compose.yml with a Cloudflare Tunnel in front instead of Caddy (docs/web/VPS.md, "Cloudflare"): cloudflared
# connects out to Cloudflare, so the VPS needs no open port for the game at all.  cloudflared and the server
# share one network namespace (a Docker network, not the VPS's): cloudflared reaches the server on
# 127.0.0.1:8080, nothing else can, and the client's address comes from Cloudflare's CF-Connecting-IP.  In
# Cloudflare's dashboard the tunnel's public hostname is NFSU2_HOST and its service http://127.0.0.1:8080.
#
# In .env, besides NFSU2_HOST, NFSU2_DATA and NFSU2_MODULE (compose.yml):
#   TUNNEL_TOKEN=<the tunnel's token>
#   COMPOSE_FILE=compose.yml:compose.tunnel.yml     so that plain "docker compose ..." uses both files
# then:  docker compose up -d && docker compose logs -f server
services:
  caddy:
    profiles: [off]          # not started: cloudflared is the front
  # holds the namespace, so that cloudflared and the server can each restart on their own (with the server in
  # cloudflared's own namespace, a restarted cloudflared got a new one and reached nothing until the server
  # was restarted too)
  net:
    image: registry.k8s.io/pause:3.10
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    network_mode: service:net
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env, the tunnel's token}
    logging: { driver: local }
  server:
    network_mode: service:net
    environment:
      NFSU2_REAL_IP_HEADER: cf-connecting-ip
