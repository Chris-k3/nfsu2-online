# The forum bot on a server with Docker (README.md, "In Docker"): this file and .env in one folder, then
#   docker compose up -d
services:
  bot:
    image: ghcr.io/th0mk/nfsu2-web-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_REPO: https://github.com/th0mk/nfsu2-web.git
    volumes:
      - state:/state
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  state:
