# The server's container image (Dockerfile, docs/web/VPS.md) -> ghcr.io/<owner>/<repo>, for amd64 and arm64.
# Tags: latest (the default branch), <version> and <major>.<minor> (a v* tag), sha-<commit> (every push).
# Pull requests build it without pushing.  The image never holds the game or the game module: the build sees only
# the server's and the page's sources (.dockerignore), and those are all a checkout has.
name: image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: [Dockerfile, .dockerignore, 'web/**', app/registry-defaults.txt, .github/workflows/image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the image's own stage only copies (the page is built on the runner's platform), so no QEMU
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
